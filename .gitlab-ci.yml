stages:
  - security-scan
  - code-quality
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

# 1. Сканирование файловой системы с Trivy
trivy-fs-scan:
  stage: security-scan
  image: alpine:latest
  before_script:
    - apk update && apk add --no-cache curl jq
    - export TRIVY_VERSION=$(curl -s "https://api.github.com/repos/aquasecurity/trivy/releases/latest" | jq -r '.tag_name' | sed 's/v//')
    - echo "Installing Trivy version $TRIVY_VERSION"
    - curl -L "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -zxvf -
  script:
    - echo "Сканирование файловой системы проекта..."
    - ./trivy filesystem --exit-code 1 --severity HIGH,CRITICAL .
    - echo "Файловая система проверена"
  cache:
    paths:
      - .trivycache/
  allow_failure: false
  tags:
    - docker

# 2. Анализ качества кода с SonarQube
sonarqube-check:
  stage: code-quality
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - apk add --no-cache python3 python3-dev py3-pip
    - echo "Подготовка к анализу SonarQube..."
    - echo "Проект ${CI_PROJECT_NAME}"
    - echo "Ветка ${CI_COMMIT_REF_NAME}"
    - echo "Коммит ${CI_COMMIT_SHA}"
  script:
    - echo "Запуск анализа кода с SonarQube..."
    - sonar-scanner -Dsonar.projectKey="${CI_PROJECT_NAME}" -Dsonar.projectName="${CI_PROJECT_NAME}" -Dsonar.projectVersion="${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}" -Dsonar.sources=. -Dsonar.exclusions="**/*.md,**/*.txt,**/*.json,**/tests/**,**/.git/**" -Dsonar.python.coverage.reportPaths="" -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.login="${SONAR_TOKEN}" -Dsonar.qualitygate.wait=true
    - echo "Анализ SonarQube завершен"
  after_script:
    - echo "Результаты анализа доступны в SonarQube ${SONAR_HOST_URL}"
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID
  tags:
    - docker


# 3. Тесты
test:
  stage: test
  image: python:3.9-slim
  script:
    - cd snake
    - pip install -r requirements.txt
    - pytest ./tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  tags:
    - docker

# 4. Сборка Docker образа
build:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
  before_script:
    - docker info
  script:
    - cd snake
    - docker build -t snake-app .
    - docker tag snake-app $CI_REGISTRY_IMAGE:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:latest
  tags:
    - docker


# 5. Сканирование Docker образа после сборки c Trivy
trivy-image-scan:
  stage: deploy
  image: alpine:latest
  services:
    - name: docker:dind
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  variables:
    DOCKER_HOST: tcp://docker:2375/
  before_script:
    - apk update && apk add --no-cache curl jq docker
    - export TRIVY_VERSION=$(curl -s "https://api.github.com/repos/aquasecurity/trivy/releases/latest" | jq -r '.tag_name' | sed 's/v//')
    - curl -L "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -zxvf -
  script:
    - echo "Сканирование Docker образа $CI_REGISTRY_IMAGE:latest..."
    - ./trivy image --exit-code 0 --format table $CI_REGISTRY_IMAGE:latest
    - ./trivy image --exit-code 1 --severity CRITICAL $CI_REGISTRY_IMAGE:latest
    - echo "Docker образ проверен"
  dependencies:
    - build
  tags:
    - docker

# 6. Деплой (локально)
deploy:
  stage: deploy
  timeout: 10 minutes  
  before_script:
    - echo "Текущая директория:" 
    - powershell.exe -Command "Get-Location"
    - echo "Содержимое директории:"
    - powershell.exe -Command "Get-ChildItem | Select-Object Name, Length, LastWriteTime"
    - echo "Проверяем наличие deploy.ps1:"
    - powershell.exe -Command "Test-Path .\deploy.ps1"
  script:
    - powershell.exe -ExecutionPolicy Bypass -File .\deploy.ps1
    - echo "Деплой завершен успешно"
  after_script:
    - echo "Финальная информация о деплое"
    - powershell.exe -Command "Get-Date"
  only:
    - main
  tags:
    - shell
  dependencies:
    - build
    - trivy-image-scan

