<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="snake-main-title">🐍 Snake Game</h1>
        
        <div style="text-align: center; margin: 10px 0; color: #fff;">
            Добро пожаловать, <strong>{{ username }}</strong>!
        </div>
        
        <div class="game-container">
            <div class="game-info">
                <div>Текущий счёт: <span id="current-score">0</span></div>
                <div>Рекорд: <span id="high-score">0</span></div>
            </div>
            
            <canvas id="game-canvas" width="400" height="400"></canvas>
            
            <div class="controls">
                <p>Управление: стрелки или WASD<br>Нажми любую клавишу чтобы начать</p>
            </div>
            
            <div style="text-align: center;">
                <a href="{{ url_for('leaderboard') }}" class="btn">Таблица лидеров</a>
                <a href="{{ url_for('logout') }}" class="btn" style="background: #dc3545; margin-left: 10px;">Выход</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
